<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="A cleaning bucket full of gold coins">
  <title>Filthy Rich — the bucket that fills up</title>

  <rect width="256" height="256" rx="56" fill="#0b0b0e"/>

  <!-- handle -->
  <path d="M 88 138 A 40 40 0 0 1 168 138" fill="none" stroke="#9aa6ae" stroke-width="8" stroke-linecap="round"/>

  <!-- coins sitting inside the mouth, drawn behind the rim -->
  <g fill="#f2c14e">
    <circle cx="98" cy="128" r="14"/>
    <circle cx="124" cy="118" r="16"/>
    <circle cx="152" cy="126" r="14"/>
    <circle cx="172" cy="138" r="10"/>
    <circle cx="112" cy="140" r="12"/>
    <circle cx="142" cy="142" r="12"/>
  </g>
  <g fill="none" stroke="#b98a2a" stroke-width="2">
    <circle cx="98" cy="128" r="14"/>
    <circle cx="124" cy="118" r="16"/>
    <circle cx="152" cy="126" r="14"/>
    <circle cx="112" cy="140" r="12"/>
    <circle cx="142" cy="142" r="12"/>
  </g>

  <!-- bucket -->
  <path d="M 76 142 H 180 L 170 202 A 22 22 0 0 1 148 220 H 108 A 22 22 0 0 1 86 202 Z" fill="#2e7d8c"/>
  <rect x="72" y="132" width="112" height="20" rx="10" fill="#1d5a66"/>

  <!-- coin still falling -->
  <circle cx="198" cy="180" r="11" fill="#f2c14e"/>
  <circle cx="198" cy="180" r="11" fill="none" stroke="#b98a2a" stroke-width="2"/>

  <path d="M 58 86 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z" fill="#fff3c4"/>
  <path d="M 200 62 l 3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 z" fill="#fff3c4"/>
</svg>
