<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="A mop with gold strands">
  <title>Filthy Rich — a mop made of money</title>

  <rect width="256" height="256" rx="56" fill="#0b0b0e"/>

  <!-- handle -->
  <rect x="142" y="32" width="14" height="90" rx="7" fill="#c9c2b4"/>
  <!-- collar -->
  <rect x="124" y="118" width="50" height="20" rx="4" fill="#d9a63a"/>

  <!-- mop head: one bulky mass with a frayed fringe, not radiating spikes -->
  <path d="M 120 134 H 176 L 190 180
           L 184 190 L 178 180
           L 172 194 L 166 182
           L 160 196 L 154 184
           L 148 198 L 142 184
           L 136 192 L 130 182
           L 124 188 L 118 180 Z"
        fill="#f2c14e" stroke="#f2c14e" stroke-width="3" stroke-linejoin="round"/>

  <!-- a few strands hanging longer than the rest -->
  <path d="M 129 188 Q 124 200 122 207 Q 130 197 137 190 Z" fill="#e0ab35"/>
  <path d="M 159 190 Q 163 199 165 206 Q 159 197 152 192 Z" fill="#e0ab35"/>

  <!-- lighter strands catching the light -->
  <g fill="#f8d46c">
    <path d="M 126 140 L 136 140 Q 128 164 124 178 L 120 168 Z"/>
    <path d="M 148 140 L 158 140 Q 152 166 150 182 L 144 172 Z"/>
  </g>

  <g fill="#fff3c4">
    <path d="M 78 108 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z"/>
    <path d="M 190 156 l 3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 z"/>
  </g>
</svg>
