<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Interlocked F and R monogram in gold">
  <title>Filthy Rich — FR monogram</title>
  <defs>
    <linearGradient id="l2-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="l2-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#f4c455"/>
      <stop offset="1" stop-color="#c08b25"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#l2-tile)"/>

  <!-- F -->
  <g fill="url(#l2-gold)">
    <rect x="56" y="72" width="18" height="112" rx="4"/>
    <rect x="56" y="72" width="66" height="18" rx="4"/>
    <rect x="56" y="118" width="50" height="16" rx="4"/>
  </g>

  <!-- R -->
  <g fill="url(#l2-gold)">
    <rect x="144" y="72" width="18" height="112" rx="4"/>
  </g>
  <g fill="none" stroke="url(#l2-gold)" stroke-width="18" stroke-linecap="round">
    <path d="M 155 81 H 178 A 24 24 0 0 1 178 129 H 155"/>
    <path d="M 172 129 L 202 184"/>
  </g>

  <!-- sparkle: the clean finish -->
  <path d="M 206 44 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#ffe9a3"/>
</svg>
