<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Dollar sign knocked out of a gold block">
  <title>Filthy Rich — knocked-out mark</title>
  <defs>
    <mask id="cut">
      <rect width="256" height="256" fill="#000000"/>
      <path d="M 66 62 H 190 A 24 24 0 0 1 214 86 V 170 A 24 24 0 0 1 190 194 H 66 A 24 24 0 0 1 42 170 V 86 A 24 24 0 0 1 66 62 Z"
            fill="#ffffff"/>
      <!-- the dollar is a hole, not a gold shape on top -->
      <g transform="translate(24 26) scale(0.8)">
        <path d="M 148 96 A 23 23 0 0 0 102 96 C 102 119 148 123 148 146 A 23 23 0 0 1 102 146"
              fill="none" stroke="#000000" stroke-width="20"/>
        <rect x="115" y="58" width="20" height="126" fill="#000000"/>
      </g>
      <!-- pores cut out too -->
      <g fill="#000000">
        <circle cx="68" cy="94" r="8"/>
        <circle cx="196" cy="104" r="6"/>
        <circle cx="62" cy="152" r="6"/>
        <circle cx="196" cy="160" r="7"/>
        <circle cx="70" cy="172" r="6"/>
        <circle cx="176" cy="74" r="5"/>
      </g>
    </mask>
  </defs>

  <rect width="256" height="256" rx="40" fill="#0b0b0e"/>
  <rect width="256" height="256" rx="40" fill="#f2c14e" mask="url(#cut)"/>
</svg>
