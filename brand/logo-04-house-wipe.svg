<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="A house half covered in grime, half wiped clean to gold">
  <title>Filthy Rich — the house you clean into gold</title>
  <defs>
    <linearGradient id="l4-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="l4-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#f4c455"/>
      <stop offset="1" stop-color="#c08b25"/>
    </linearGradient>
    <linearGradient id="l4-grime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4136"/>
      <stop offset="1" stop-color="#221d17"/>
    </linearGradient>
    <clipPath id="l4-house">
      <path d="M 128 48 L 208 116 V 200 H 48 V 116 Z"/>
    </clipPath>
    <clipPath id="l4-clean">
      <path d="M 128 36 C 116 76 142 108 126 138 C 114 166 140 186 128 212 L 224 212 L 224 36 Z"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#l4-tile)"/>

  <!-- filthy house -->
  <path d="M 128 48 L 208 116 V 200 H 48 V 116 Z" fill="url(#l4-grime)"/>
  <!-- the wipe -->
  <g clip-path="url(#l4-clean)">
    <path d="M 128 48 L 208 116 V 200 H 48 V 116 Z" fill="url(#l4-gold)"/>
  </g>

  <!-- openings -->
  <g clip-path="url(#l4-house)">
    <rect x="90" y="150" width="30" height="50" rx="4" fill="#1b1712" opacity="0.85"/>
    <rect x="60" y="132" width="22" height="22" rx="3" fill="#1b1712" opacity="0.55"/>
    <rect x="168" y="132" width="22" height="22" rx="3" fill="#6b4a12" opacity="0.55"/>
    <g fill="#100d0a" opacity="0.5">
      <circle cx="64" cy="152" r="5"/>
      <circle cx="88" cy="176" r="6"/>
      <circle cx="60" cy="188" r="4"/>
      <circle cx="100" cy="142" r="3"/>
      <circle cx="74" cy="168" r="3"/>
    </g>
  </g>

  <!-- shine -->
  <path d="M 196 70 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#fff6d8"/>
</svg>
