<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="A sponge with a gold dollar sign">
  <title>Filthy Rich — the sponge that pays</title>

  <rect width="256" height="256" rx="56" fill="#0b0b0e"/>

  <!-- sponge block, slightly uneven corners so it reads used rather than geometric -->
  <path d="M 68 78 H 188 A 20 20 0 0 1 208 98 V 162 A 22 22 0 0 1 186 184 H 66 A 22 22 0 0 1 44 162 V 100 A 24 24 0 0 1 68 78 Z"
        fill="#5a4d38"/>

  <!-- pores, cut straight out of the block -->
  <g fill="#1e1a13">
    <circle cx="70" cy="106" r="8"/>
    <circle cx="104" cy="94" r="5"/>
    <circle cx="146" cy="100" r="7"/>
    <circle cx="186" cy="108" r="5"/>
    <circle cx="62" cy="146" r="6"/>
    <circle cx="96" cy="164" r="7"/>
    <circle cx="132" cy="150" r="4"/>
    <circle cx="168" cy="166" r="8"/>
    <circle cx="196" cy="146" r="4"/>
    <circle cx="120" cy="124" r="3"/>
    <circle cx="176" cy="128" r="3"/>
  </g>

  <!-- dollar sign: true S from two real arcs, square-cut bar through it -->
  <g fill="none" stroke="#f2c14e" stroke-width="17">
    <path d="M 148 100 A 22 22 0 0 0 104 100 C 104 122 148 126 148 148 A 22 22 0 0 1 104 148"/>
  </g>
  <rect x="117.5" y="66" width="17" height="118" fill="#f2c14e"/>

  <g fill="#fff3c4">
    <path d="M 196 56 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
    <path d="M 58 44 l 3.5 8.5 8.5 3.5 -8.5 3.5 -3.5 8.5 -3.5 -8.5 -8.5 -3.5 8.5 -3.5 z"/>
  </g>
</svg>
