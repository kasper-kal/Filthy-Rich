<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Filthy Rich mark and name">
  <title>Filthy Rich — mark and name</title>
  <defs>
    <radialGradient id="k-bg" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#17171e"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="k-gold" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.42" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b8811f"/>
    </linearGradient>

    <path id="k-F" d="M 7 7 V 33 M 7 7 H 23 M 7 20 H 19"/>
    <path id="k-I" d="M 15 7 V 33"/>
    <path id="k-L" d="M 7 7 V 33 H 23"/>
    <path id="k-T" d="M 0 7 H 30 M 15 7 V 33"/>
    <path id="k-H" d="M 7 7 V 33 M 23 7 V 33 M 7 20 H 23"/>
    <path id="k-Y" d="M 7 7 L 15 20 L 23 7 M 15 20 V 33"/>
    <path id="k-R" d="M 7 33 V 7 H 16 A 7 7 0 0 1 16 21 H 7 M 16 21 L 24 33"/>
    <path id="k-C" d="M 24 12 A 11 11 0 1 0 24 28"/>

    <mask id="k-cut">
      <rect width="256" height="256" fill="#000000"/>
      <path d="M 66 62 H 190 A 24 24 0 0 1 214 86 V 170 A 24 24 0 0 1 190 194 H 66 A 24 24 0 0 1 42 170 V 86 A 24 24 0 0 1 66 62 Z"
            fill="#ffffff"/>
      <g transform="translate(24 26) scale(0.8)">
        <path d="M 148 96 A 23 23 0 0 0 102 96 C 102 119 148 123 148 146 A 23 23 0 0 1 102 146"
              fill="none" stroke="#000000" stroke-width="20"/>
        <rect x="115" y="58" width="20" height="126" fill="#000000"/>
      </g>
      <g fill="#000000">
        <circle cx="68" cy="94" r="8"/>
        <circle cx="196" cy="104" r="6"/>
        <circle cx="62" cy="152" r="6"/>
        <circle cx="196" cy="160" r="7"/>
        <circle cx="70" cy="172" r="6"/>
        <circle cx="176" cy="74" r="5"/>
      </g>
    </mask>

    <clipPath id="k-below"><rect x="0" y="196" width="256" height="60"/></clipPath>
  </defs>

  <rect width="256" height="256" fill="url(#k-bg)"/>

  <!-- mark -->
  <g transform="translate(69.5 34) scale(0.68) translate(-42 -60)">
    <g mask="url(#k-cut)">
      <rect width="256" height="256" fill="url(#k-gold)"/>
      <rect x="0" y="150" width="256" height="106" fill="#4a3f2e"/>
      <rect x="0" y="148" width="256" height="3" fill="#fff0b8" opacity="0.85"/>
    </g>
  </g>

  <!-- name, one line -->
  <g transform="translate(35 176) scale(0.5)">
    <g fill="none" stroke="url(#k-gold)" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter">
      <use href="#k-F" x="0" y="0"/>
      <use href="#k-I" x="33" y="0"/>
      <use href="#k-L" x="66" y="0"/>
      <use href="#k-T" x="99" y="0"/>
      <use href="#k-H" x="132" y="0"/>
      <use href="#k-Y" x="165" y="0"/>
      <use href="#k-R" x="220" y="0"/>
      <use href="#k-I" x="253" y="0"/>
      <use href="#k-C" x="286" y="0"/>
      <use href="#k-H" x="319" y="0"/>
    </g>
    <g clip-path="url(#k-below)" fill="none" stroke="#4a3f2e" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter">
      <use href="#k-F" x="0" y="0"/>
      <use href="#k-I" x="33" y="0"/>
      <use href="#k-L" x="66" y="0"/>
      <use href="#k-T" x="99" y="0"/>
      <use href="#k-H" x="132" y="0"/>
      <use href="#k-Y" x="165" y="0"/>
      <use href="#k-R" x="220" y="0"/>
      <use href="#k-I" x="253" y="0"/>
      <use href="#k-C" x="286" y="0"/>
      <use href="#k-H" x="319" y="0"/>
    </g>
    <rect x="0" y="39" width="349" height="5" fill="#fff0b8" opacity="0.85"/>
  </g>
</svg>
