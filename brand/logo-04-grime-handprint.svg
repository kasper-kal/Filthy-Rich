<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="A grimy handprint holding a gold coin">
  <title>Filthy Rich — filth in hand, money in hand</title>

  <rect width="256" height="256" rx="56" fill="#0b0b0e"/>

  <!-- one flat handprint silhouette, no shading -->
  <g fill="#6b5a44">
    <rect x="100" y="96" width="18" height="58" rx="9"/>
    <rect x="122" y="82" width="18" height="72" rx="9"/>
    <rect x="144" y="90" width="18" height="64" rx="9"/>
    <rect x="166" y="104" width="17" height="50" rx="8.5"/>
    <path d="M 92 156 C 92 134 110 120 132 120 C 156 120 174 134 174 158 C 174 184 156 200 132 200 C 108 200 92 182 92 156 Z"/>
    <rect x="86" y="132" width="18" height="52" rx="9" transform="rotate(-34 95 158)"/>
  </g>

  <!-- coin in the palm -->
  <circle cx="132" cy="158" r="26" fill="#f2c14e"/>
  <circle cx="132" cy="158" r="26" fill="none" stroke="#b98a2a" stroke-width="3"/>
  <circle cx="132" cy="158" r="18" fill="none" stroke="#d9a63a" stroke-width="2"/>

  <!-- the same dollar sign as the main mark, scaled into the coin -->
  <g transform="translate(132 158) scale(0.26) translate(-126 -125)">
    <path d="M 148 100 A 22 22 0 0 0 104 100 C 104 122 148 126 148 148 A 22 22 0 0 1 104 148"
          fill="none" stroke="#8f6516" stroke-width="17"/>
    <rect x="117.5" y="64" width="17" height="122" fill="#8f6516"/>
  </g>

  <path d="M 198 82 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 z" fill="#fff3c4"/>
</svg>
